<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎶 NUESTRAS CANCIONES AMOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-principal">
        <header>
            <h1>🎶 NUESTRAS CANCIONES AMOR</h1>
            <p class="subtitulo">Los momentos que nos unen, en cada nota 💛</p>
        </header>

        <section class="reproductor-activo">
            <div class="video-contenedor">
                <iframe id="reproductor" width="100%" height="315" 
                    src="" 
                    title="Reproductor de YouTube" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="info-cancion">
                <h2 id="titulo-cancion">Selecciona una canción</h2>
                <p id="artista-cancion">—</p>
                <p id="historia-cancion" class="historia">Elige una canción de la lista para escucharla aquí 💛</p>
            </div>
        </section>

        <section class="lista-canciones">
            <h3>📋 Nuestra Playlist</h3>
            <ul id="playlist"></ul>
        </section>
    </div>

    <footer>
        <p>Hecho con ❤️🥹 te amo lay — Para siempre</p>
    </footer>

    <script>
        const canciones = [
            {
                titulo: "En Tus Manos",
                artista: "Los Bybys",
                videoId: "zA7EldXYens",
                historia: "Porque todo lo que somos y todo lo que seremos está en tus manos. Nos da seguridad, confianza y la certeza de que juntos podemos con todo. Esta canción representa la entrega total, el decir 'aquí estoy, confío en ti' 💞✨"
            },
            {
                titulo: "A Dónde Vamos",
                artista: "Morat",
                videoId: "TYrcdhots80",
                historia: "Contigo no importa el destino, lo que importa es ir de la mano. Esta canción nos recuerda que lo mejor no es saber a dónde vamos, sino saber con quién vamos. Y contigo, a cualquier lugar 💫❤️"
            },
            {
                titulo: "Aprender A Quererte",
                artista: "Morat",
                videoId: "OukQDrJ7QRQ",
                historia: "Quererte no es algo que se aprende, pero cada día me esfuerzo por hacerlo mejor. Esta canción dice exactamente lo que siento: quiero entenderte, cuidarte y amarte cada día más, de la forma que mereces 💜📖"
            },
            {
                titulo: "Quiero y Necesito",
                artista: "Jesse Manuel Figueroa",
                videoId: "4P9hudHysXA",
                historia: "La perfección no está en el lugar, está en estar contigo. Cada noche a tu lado es especial, pero hay una que guardaré para siempre como la más bonita de todas. Tú, yo y el momento justo ✨🌙"
            },
            {
                titulo: "Colgando en Tus Manos",
                artista: "Pedro Baute",
                videoId: "qExd-3oCTl4",
                historia: "Como si todo dependiera de ti, así me siento: en tus manos está mi felicidad, mi corazón y mi futuro. No quiero estar en ningún otro lugar que no sea entre tus brazos 💖✨"
            },
            {
                titulo: "El Milagro de Tus Ojos",
                artista: "Pedro Fernández",
                videoId: "gnGHarl9dIY",
                historia: "Dicen que los ojos son el espejo del alma, y los tuyos son el milagro más hermoso que he visto. En ellos encuentro todo lo que siempre busqué: paz, amor y mi hogar 💫👀❤️"
            }
        ];

        const lista = document.getElementById('playlist');
        const reproductor = document.getElementById('reproductor');
        const tituloActual = document.getElementById('titulo-cancion');
        const artistaActual = document.getElementById('artista-cancion');
        const historiaActual = document.getElementById('historia-cancion');

        function cargarPlaylist() {
            lista.innerHTML = '';
            canciones.forEach(cancion => {
                const li = document.createElement('li');
                li.className = 'cancion-item';
                li.innerHTML = `
                    <div class="miniatura">▶</div>
                    <div class="datos">
                        <strong>${cancion.titulo}</strong>
                        <span>${cancion.artista}</span>
                    </div>
                `;
                li.addEventListener('click', () => mostrarCancion(cancion));
                lista.appendChild(li);
            });
        }

        function mostrarCancion(cancion) {
            reproductor.src = `https://www.youtube.com/embed/${cancion.videoId}?autoplay=1&rel=0&modestbranding=1`;
            tituloActual.textContent = cancion.titulo;
            artistaActual.textContent = cancion.artista;
            historiaActual.textContent = cancion.historia;
        }

        cargarPlaylist();
    </script>
</body>
</html>
